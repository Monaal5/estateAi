services:
  - type: web
    name: estate-ai
    runtime: python
    buildCommand: "npm install && npm run build && pip install -r backend/requirements.txt"
    startCommand: "uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      # Neon PostgreSQL connection string, e.g.
      # postgresql://USER:PASSWORD@ep-xxxx.REGION.aws.neon.tech/neondb?sslmode=require
      # Set it in Render -> estate-ai -> Environment (it is never committed to git).
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.8

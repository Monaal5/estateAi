services:
  - type: web
    name: estate-ai
    runtime: python
    buildCommand: "npm install && npm run build && pip install -r backend/requirements.txt"
    startCommand: "uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: estate-ai-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.8

databases:
  - name: estate-ai-db
    databaseName: estate_ai
    user: estate_ai_user
    plan: free
